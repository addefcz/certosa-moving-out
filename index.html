<html lang="en">
<head>
<meta charset="UTF-8">
<title>Certosa's Moving out!</title>
<meta property="og:title" content="Certosa's Moving out! 🇮🇹">
<meta property="og:description" content="Pre-loved items, carefully chosen - browse and claim what you need. ♡">
<meta property="og:image" content="https://raw.githubusercontent.com/addefcz/certosa-moving-out/main/banner_Certosa_moving_out2.png">
<meta property="og:url" content="https://addefcz.github.io/certosa-moving-out/">
<style>
  :root{
    --paper: #F7F4EC;
    --paper-deep: #EFE9D8;
    --ink: #23282E;
    --ink-soft: #5B5650;
    --clay: #C2603D;
    --clay-deep: #A14B2E;
    --sage: #7C8A6F;
    --sage-deep: #5F6E52;
    --line: #D8D0BC;
    --card: #FFFDF8;
    --shadow: rgba(35,40,46,0.10);
    --free: #4F7D6B;
    --cat-electronics: #3D6E94;
    --cat-clothes: #9C5394;
    --cat-food: #B8842E;
    --cat-other: #6B6256;

    /* New palette: deep teal + dusty pink, layered on top of the existing neutral paper */
    --teal: #234E49;
    --teal-deep: #16352F;
    --teal-soft: #3A6B63;
    --pink: #E8B5A3;
    --pink-deep: #D99B85;
    --pink-soft: #F0C9BB;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(35,40,46,0.035) 1px, transparent 0);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .display {
    font-family: 'Georgia', 'Iowan Old Style', serif;
    font-style: italic;
    letter-spacing: -0.01em;
  }

  /* ---------- Header ---------- */
  .topbar {
    position: relative;
    padding: 30px 20px;
    text-align: center;
    background: linear-gradient(160deg, var(--teal), var(--teal-deep));
    overflow: visible;
    min-height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .topbar-text {
    position: relative;
    z-index: 2;
  }
  .topbar h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    font-style: italic;
    color: var(--paper);
  }
  .topbar h1 .accent { color: var(--pink-soft); font-style: normal; }
  .topbar p {
    margin: 6px 0 0;
    font-size: 13px;
    color: rgba(247,244,236,0.75);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .header-art {
    position: absolute;
    bottom: 20px;
    height: auto;
    width: 260px;
    object-fit: contain;
    pointer-events: none;
    z-index: 1;
  }
  .header-art.box-art { left: 150px; }
  .header-art.shopper-art { right: 150px; }
  @media (max-width: 700px) {
    .header-art { width: 120px; max-height: 160px; }
  }
  @media (max-width: 480px) {
    .header-art { width: 88px; max-height: 120px; }
    .topbar { min-height: 110px; padding: 24px 12px; }
  }

  /* ---------- Pickup banner ---------- */
  .pickup-banner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--pink-soft);
    border-bottom: 1px solid var(--pink-deep);
  }
  .pickup-banner-text {
    font-size: 13.5px;
    color: var(--teal-deep);
    line-height: 1.4;
    font-weight: 700;
  }
  .pickup-label {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 11px;
    color: var(--teal);
    margin-right: 8px;
  }

  /* ---------- Grid ---------- */
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 80px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }
  @media (max-width: 1100px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }

  /* ---------- Card ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 1px 2px var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease;
    display: flex;
    flex-direction: column;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px var(--shadow); }
  .card.is-taken { opacity: 0.62; }

  /* photo carousel */
  .carousel {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--paper-deep);
    overflow: hidden;
    touch-action: pan-y;
  }
  .carousel-track {
    display: flex;
    height: 100%;
    transition: transform .3s ease;
  }
  .carousel-track img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    flex-shrink: 0;
    user-select: none;
    -webkit-user-drag: none;
    cursor: zoom-in;
  }
  .carousel-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(247,244,236,0.88);
    border: 1px solid var(--line);
    color: var(--ink);
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    user-select: none;
  }
  .carousel-nav.prev { left: 8px; }
  .carousel-nav.next { right: 8px; }
  .carousel-dots {
    position: absolute;
    bottom: 8px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 5px;
  }
  .carousel-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(35,40,46,0.3);
  }
  .carousel-dots span.active { background: var(--clay-deep); width: 14px; border-radius: 3px; }

  .status-tag {
    position: absolute;
    top: 10px; left: -6px;
    padding: 4px 12px 4px 16px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    background: var(--sage-deep);
    transform: rotate(-4deg);
    box-shadow: 1px 2px 3px rgba(0,0,0,0.25);
    border-radius: 1px;
    z-index: 2;
  }
  .status-tag.available { background: var(--pink-deep); }

  /* body */
  .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .item-name { font-size: 18px; font-weight: 700; margin: 0; line-height: 1.25; }
  .item-brand {
    font-size: 11.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin: -0.5px 0 0;
  }
  .price-tag-row { display: flex; align-items: center; gap: 10px; margin: 2px 0; }
  .price-tag {
    position: relative;
    background: var(--pink-deep);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 5px 12px 5px 16px;
    border-radius: 2px;
    transform: rotate(-1.5deg);
  }
  .price-tag::before {
    content: '';
    position: absolute;
    left: 5px; top: 50%;
    transform: translateY(-50%);
    width: 4px; height: 4px;
    background: var(--paper);
    border-radius: 50%;
  }
  .price-tag.is-free { background: #25D366; }
  .item-name-row { display:flex; justify-content: space-between; align-items: flex-start; gap: 8px; }

  .category-label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: -2px 0 0;
    text-align: right;
  }
  .category-label.cat-electronics { color: var(--cat-electronics); }
  .category-label.cat-clothes { color: var(--cat-clothes); }
  .category-label.cat-food { color: var(--cat-food); }
  .category-label.cat-other { color: var(--cat-other); }

  .note-toggle {
    background: none; border: none;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-decoration: underline;
    text-decoration-color: var(--line);
    cursor: pointer;
    padding: 0;
    text-align: left;
    width: fit-content;
  }
  .note-body {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    max-height: 0;
    overflow: hidden;
    transition: max-height .25s ease;
  }
  .note-body.open { max-height: 200px; }
  .note-body p { margin: 6px 0 0; }

  .claim-btn {
    margin-top: auto;
    background: var(--teal);
    color: var(--paper);
    border: none;
    padding: 11px 14px;
    border-radius: 3px;
    font-weight: 700;
    font-size: 13.5px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background .15s ease;
  }
  .claim-btn:hover { background: var(--pink-deep); }
  .claim-btn:disabled {
    background: var(--teal-deep);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  .reset-btn {
    background: none;
    border: none;
    font-size: 11.5px;
    color: var(--ink-soft);
    text-decoration: underline;
    text-decoration-color: var(--line);
    cursor: pointer;
    padding: 2px 0 0;
    text-align: center;
    width: 100%;
  }
  .reset-btn:hover { color: var(--teal-deep); }

  /* ---------- Add item (host) ---------- */
  .host-toolbar {
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px 16px 0;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
  }
  .ghost-btn {
    background: none;
    border: 1px dashed var(--ink-soft);
    color: var(--ink-soft);
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .ghost-btn:hover { border-color: var(--clay-deep); color: var(--clay-deep); }

  .host-link {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 11.5px;
    text-decoration: underline;
    text-decoration-color: var(--line);
    cursor: pointer;
    padding: 4px 2px;
  }
  .host-link:hover { color: var(--clay-deep); }

  .host-badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #fff;
    background: var(--teal);
    border: 1px solid var(--teal-deep);
    padding: 4px 10px;
    border-radius: 20px;
  }

  /* ---------- Claims list (host) ---------- */
  .claims-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .claim-row {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    position: relative;
  }
  .claim-row.unconfirmed { border-color: var(--clay); background: rgba(194,96,61,0.06); }
  .claim-item-line {
    display: flex; justify-content: space-between; align-items: flex-start;
    font-weight: 700; font-size: 14.5px; margin-bottom: 6px;
  }
  .claim-detail-row { font-size: 13px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 8px; margin: 2px 0; }
  .claim-detail-row strong { color: var(--ink); font-weight: 600; }
  .claim-wa-link {
    display: inline-block;
    margin-top: 8px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--free);
    text-decoration: none;
  }
  .claim-wa-link:hover { text-decoration: underline; }
  .claim-confirm-toggle {
    position: absolute;
    top: 12px; right: 12px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--paper-deep);
    color: var(--ink-soft);
  }
  .claim-confirm-toggle.confirmed { background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }
  .claims-empty { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 30px 10px; }

  /* ---------- Filter + sort bar ---------- */
  .controls-bar {
    max-width: 1080px;
    margin: 14px auto 0;
    padding: 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-chip {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
  }
  .filter-chip:hover { border-color: var(--clay); color: var(--ink); }
.filter-chip.active {
  background: var(--teal);
  color: #fff;
  border-color: var(--teal-deep);
}
.filter-chip.free-chip {
  color: #25D366;
  font-weight: 700;
}
.filter-chip.free-chip.active {
  background: #25D366;
  border-color: #25D366;
  color: #fff;
}
.filter-chip.cat-electronics-chip { color: var(--cat-electronics); }
.filter-chip.cat-electronics-chip.active {
  background: var(--cat-electronics);
  border-color: var(--cat-electronics);
  color: #fff;
}
.filter-chip.cat-clothes-chip { color: var(--cat-clothes); }
.filter-chip.cat-clothes-chip.active {
  background: var(--cat-clothes);
  border-color: var(--cat-clothes);
  color: #fff;
}

  .sort-select {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 7px 10px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .sort-select:focus { outline: 2px solid var(--clay); outline-offset: 1px; }

  /* ---------- Card action row (edit/delete) ---------- */
  .card-actions {
    position: absolute;
    top: 10px; right: 10px;
    z-index: 3;
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(247,244,236,0.92);
    border: 1px solid var(--line);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    cursor: pointer;
    line-height: 1;
  }
  .icon-btn:hover { border-color: var(--clay-deep); color: var(--clay-deep); }
  .icon-btn.danger:hover { border-color: #B0392E; color: #B0392E; }

  /* ---------- Modal shared ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(35,40,46,0.55);
    display: flex; align-items: flex-end;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  @media (min-width: 640px) {
    .overlay { align-items: center; }
  }

  .sheet {
    background: var(--paper);
    width: 100%;
    max-width: 460px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 14px 14px 0 0;
    padding: 22px 22px 26px;
    transform: translateY(24px);
    transition: transform .22s ease;
    border: 1px solid var(--line);
  }
  @media (min-width: 640px) {
    .sheet { border-radius: 10px; margin: 20px; }
  }
  .overlay.open .sheet { transform: translateY(0); }

  .sheet-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 14px;
  }
  .sheet-head h2 { margin: 0; font-size: 19px; font-weight: 700; }
  .close-x {
    background: none; border: none; font-size: 20px; cursor: pointer;
    color: var(--ink-soft); line-height: 1; padding: 4px;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-soft); margin-bottom: 6px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--card);
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: 2px solid var(--clay);
    outline-offset: 1px;
    border-color: var(--clay);
  }
  .field textarea { resize: vertical; min-height: 56px; }
  .hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .checkbox-row {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 16px;
  }
  .checkbox-row input { margin-top: 2px; width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--clay-deep); }
  .checkbox-row span { font-size: 13px; line-height: 1.45; color: var(--ink); }
  .checkbox-row strong { font-weight: 700; }

  .summary-line {
    display: flex; justify-content: space-between;
    font-size: 14px; padding: 10px 0;
    border-top: 1px dashed var(--line);
  }
  .summary-line.total { font-weight: 700; font-size: 16px; }

  .pickup-info-box {
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13.5px;
    margin: 4px 0 16px;
  }

  .submit-btn {
    width: 100%;
    background: var(--teal);
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 5px;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    margin-top: 6px;
  }
  .submit-btn:hover { background: var(--pink-deep); }
  .submit-btn:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }

  .error-text { color: var(--clay-deep); font-size: 12px; margin-top: 4px; }

  .success-box {
    text-align: center;
    padding: 10px 4px 4px;
  }
  .success-icon {
    width: 52px; height: 52px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--sage-deep);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .success-box h2 { margin: 0 0 8px; }
  .success-box p { color: var(--ink-soft); font-size: 13.5px; line-height: 1.5; }

  .loading-msg { text-align: center; padding: 50px 0; color: var(--ink-soft); font-size: 13px; }

  /* item form preview thumbs */
  .thumb-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .thumb-row img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }

  .footer-note {
  text-align: center;
  font-size: 13px;
  color: var(--ink-soft);
  padding: 18px 20px 4px;
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.5;
  }

  .pin-input-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .pin-input-row input {
    flex: 1;
    letter-spacing: 0.3em;
    text-align: center;
    font-size: 18px;
  }

  /* ---------- Lightbox ---------- */
  .lightbox-overlay {
    position: fixed; inset: 0;
    background: rgba(20,22,25,0.94);
    z-index: 80;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .lightbox-overlay.open { opacity: 1; pointer-events: auto; }
  .lightbox-stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: pan-y;
  }
  .lightbox-track {
    display: flex;
    height: 100%;
    width: 100%;
    transition: transform .3s ease;
  }
  .lightbox-track-item {
    flex-shrink: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 60px;
    box-sizing: border-box;
  }
  .lightbox-track-item img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }
  .lightbox-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.22); }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 22px;
    z-index: 2;
  }
  .lightbox-nav:hover { background: rgba(255,255,255,0.22); }
  .lightbox-nav.prev { left: 16px; }
  .lightbox-nav.next { right: 16px; }
  .lightbox-caption {
    position: absolute;
    bottom: 18px; left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    z-index: 2;
  }
  .lightbox-dots {
    position: absolute;
    bottom: 44px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 6px;
    z-index: 2;
  }
  .lightbox-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.35);
  }
  .lightbox-dots span.active { background: #fff; width: 16px; border-radius: 3px; }
</style>
</head>
<body>

<div class="topbar">
  <img class="header-art box-art" src="https://lh3.googleusercontent.com/pw/AP1GczOS5a8qEneBAV6ZXsp0FI9PKk0JjVuzMAoEimQeOEn9cT_H5pbkVspXy2iZZhGtPvNLWU6-G4WOyBR-P7Q78PyeDx8uMiP4xsxewi-YtyViXlFRPX0=w600-h315-p-k" alt="">
  <div class="topbar-text">
    <h1><span class="accent">Certosa</span>'s Moving out!</h1>
    <p id="subtitle">Pre-loved and carefully chosen</p>
  </div>
  <img class="header-art shopper-art" src="https://lh3.googleusercontent.com/pw/AP1GczMIUCqxYGKw0x0XicduXL2yjBuq5qaBA5cVQolg2XS0o0PZiElL5pElja0At-dc2S0Pj3h4aRefTGsA2AJTRW2PgUOtNJHq9JptfO32F9HNhDMc04U=w600-h315-p-k" alt="">
</div>

<div class="pickup-banner" id="pickupBanner">
  <div class="pickup-banner-text">
    <span class="pickup-label">Pickup</span>
    <span id="pickupBannerContent">Loading…</span>
  </div>
  <button class="ghost-btn" id="editPickupBtn">Edit</button>
</div>

<div class="host-toolbar">
  <span class="host-badge" id="hostBadge" style="display:none;">Host mode</span>
  <button class="ghost-btn" id="viewClaimsBtn" style="display:none;">View claims</button>
  <button class="ghost-btn" id="addItemBtn" style="display:none;">+ Add an item</button>
  <button class="host-link" id="hostLoginBtn">Host login</button>
  <button class="host-link" id="hostLogoutBtn" style="display:none;">Log out</button>
</div>

<div class="controls-bar">
  <div class="filter-bar" id="filterBar"></div>
  <select class="sort-select" id="sortSelect">
    <option value="default">Sort: Default</option>
    <option value="price-asc">Price: Low to High</option>
    <option value="price-desc">Price: High to Low</option>
  </select>
</div>

<div class="footer-note">Tap an item's photo to browse pictures. Tap "I want this" to claim it.</div>

<div class="wrap">
  <div id="grid" class="grid">
    <div class="loading-msg">Loading items…</div>
  </div>
</div>

<!-- Edit pickup info overlay -->
<div class="overlay" id="pickupOverlay">
  <div class="sheet" id="pickupSheet"></div>
</div>

<!-- Checkout overlay -->
<div class="overlay" id="checkoutOverlay">
  <div class="sheet" id="checkoutSheet"></div>
</div>

<!-- Add item overlay -->
<div class="overlay" id="addOverlay">
  <div class="sheet" id="addSheet"></div>
</div>

<!-- Host PIN overlay -->
<div class="overlay" id="pinOverlay">
  <div class="sheet" id="pinSheet"></div>
</div>

<!-- Claims overlay (host) -->
<div class="overlay" id="claimsOverlay">
  <div class="sheet" id="claimsSheet" style="max-width:540px;"></div>
</div>

<!-- Photo lightbox -->
<div class="lightbox-overlay" id="lightboxOverlay">
  <div class="lightbox-stage" id="lightboxStage">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <div class="lightbox-track" id="lightboxTrack"></div>
    <button class="lightbox-nav prev" id="lightboxPrev">‹</button>
    <button class="lightbox-nav next" id="lightboxNext">›</button>
    <div class="lightbox-dots" id="lightboxDots"></div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
</div>

<script>
(function(){

  // ---------- Helpers ----------
  function esc(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  const CATEGORIES = {
    electronics: { label: 'Electronics', cls: 'cat-electronics' },
    clothes: { label: 'Clothes', cls: 'cat-clothes' },
    food: { label: 'Food', cls: 'cat-food' },
    other: { label: 'Others', cls: 'cat-other' }
  };

  // ---------- Backend config ----------
  // Paste your Apps Script Web App URL here (ends in /exec)
  const SHOP_API_URL = 'https://script.google.com/macros/s/AKfycbzxIsB-jo2o-q5VI9H78K06AR5xAyeh1AyV0p8nk5t6emI3fpfHpRGhxNYO1HNa6AovmA/exec';

  // Seller's WhatsApp number (international format, digits only, no + or spaces)
  const SELLER_WA = '393447539531';

  let isHost = false;
  let hostPin = ''; // kept in memory only for this tab session, never written to the page source

  let items = [];
  let pickupInfo = { when: '', where: '' };
  let carouselState = {};
  let activeFilter = 'all';
  let sortMode = 'default';

  // ---------- API helper ----------
  // Apps Script's /exec endpoint can lose POST bodies across its internal
  // redirect to script.googleusercontent.com, so every call here uses GET
  // with parameters in the query string instead of a POST body.
  async function apiCall(action, payload){
    payload = payload || {};
    const qs = new URLSearchParams();
    qs.set('action', action);
    Object.keys(payload).forEach(key => {
      const val = payload[key];
      qs.set(key, typeof val === 'object' ? JSON.stringify(val) : String(val));
    });
    try{
      const res = await fetch(`${SHOP_API_URL}?${qs.toString()}`);
      return await res.json();
    }catch(e){
      console.error('API call failed', action, e);
      return { error: 'network_error' };
    }
  }

  // ---------- Loading ----------
  async function loadItems(){
    const res = await apiCall('getItems');
    items = (res && res.items) ? res.items : [];
    render();
  }

  async function loadPickupInfo(){
    const res = await apiCall('getPickupInfo');
    pickupInfo = (res && res.pickupInfo) ? res.pickupInfo : { when: 'Saturday, 18/07/26 at 02:00pm', where: 'Milano Cadorna Station' };
    renderPickupBanner();
  }

  function renderPickupBanner(){
    const el = document.getElementById('pickupBannerContent');
    if(el) el.textContent = `${pickupInfo.when} · ${pickupInfo.where}`;
    const editBtn = document.getElementById('editPickupBtn');
    if(editBtn) editBtn.style.display = isHost ? '' : 'none';
  }

  // ---------- Host mode ----------
  function applyHostUI(){
    document.getElementById('addItemBtn').style.display = isHost ? '' : 'none';
    document.getElementById('viewClaimsBtn').style.display = isHost ? '' : 'none';
    document.getElementById('hostBadge').style.display = isHost ? '' : 'none';
    document.getElementById('hostLoginBtn').style.display = isHost ? 'none' : '';
    document.getElementById('hostLogoutBtn').style.display = isHost ? '' : 'none';
    const editPickupBtn = document.getElementById('editPickupBtn');
    if(editPickupBtn) editPickupBtn.style.display = isHost ? '' : 'none';
  }

  const pinOverlay = document.getElementById('pinOverlay');
  const pinSheet = document.getElementById('pinSheet');

  function openPinPrompt(){
    pinSheet.innerHTML = `
      <div class="sheet-head">
        <h2>Host login</h2>
        <button class="close-x" id="closePinX">✕</button>
      </div>
      <p class="hint" style="margin-bottom:14px;">Enter the host PIN to add, edit, or delete items.</p>
      <form id="pinForm">
        <div class="field">
          <label>PIN</label>
          <div class="pin-input-row">
            <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" required placeholder="••••">
          </div>
          <p class="error-text" id="pinError" style="display:none;">Incorrect PIN. Try again.</p>
        </div>
        <button type="submit" class="submit-btn">Unlock host mode</button>
      </form>
    `;
    document.getElementById('closePinX').addEventListener('click', closePinPrompt);
    const input = document.getElementById('pinInput');
    setTimeout(() => input.focus(), 50);

    document.getElementById('pinForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('.submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Checking…';
      const val = input.value.trim();
      const res = await apiCall('checkPin', { pin: val });
      submitBtn.disabled = false;
      submitBtn.textContent = 'Unlock host mode';
      if(res && res.ok){
        isHost = true;
        hostPin = val;
        applyHostUI();
        render();
        renderPickupBanner();
        closePinPrompt();
      } else {
        document.getElementById('pinError').style.display = 'block';
        input.value = '';
        input.focus();
      }
    });

    pinOverlay.classList.add('open');
  }
  function closePinPrompt(){ pinOverlay.classList.remove('open'); }
  pinOverlay.addEventListener('click', (e) => { if(e.target === pinOverlay) closePinPrompt(); });

  document.getElementById('hostLoginBtn').addEventListener('click', openPinPrompt);
  document.getElementById('hostLogoutBtn').addEventListener('click', () => {
    isHost = false;
    hostPin = '';
    applyHostUI();
    render();
    renderPickupBanner();
  });

  // ---------- Claims (host) ----------
  const claimsOverlay = document.getElementById('claimsOverlay');
  const claimsSheet = document.getElementById('claimsSheet');

  async function openClaimsView(){
    claimsSheet.innerHTML = `
      <div class="sheet-head">
        <h2>Claims</h2>
        <button class="close-x" id="closeClaimsX">✕</button>
      </div>
      <p class="hint" style="margin-bottom:14px;">
        Everyone who's claimed an item, with their name and WhatsApp number, so you can follow up if they don't message you.
      </p>
      <div class="loading-msg" id="claimsLoading">Loading claims…</div>
      <div class="claims-list" id="claimsList" style="display:none;"></div>
    `;
    document.getElementById('closeClaimsX').addEventListener('click', closeClaimsView);
    claimsOverlay.classList.add('open');
    await renderClaimsList();
  }
  function closeClaimsView(){ claimsOverlay.classList.remove('open'); }
  claimsOverlay.addEventListener('click', (e) => { if(e.target === claimsOverlay) closeClaimsView(); });

  function formatClaimDate(iso){
    if(!iso) return '';
    try{
      const d = new Date(iso);
      return d.toLocaleString(undefined, { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
    }catch(e){ return iso; }
  }

  async function renderClaimsList(){
    const res = await apiCall('getClaims', { pin: hostPin });
    document.getElementById('claimsLoading').style.display = 'none';
    const listEl = document.getElementById('claimsList');
    listEl.style.display = '';

    if(res && res.error){
      listEl.innerHTML = `<div class="claims-empty">Could not load claims (${esc(res.error)}). Try logging in again.</div>`;
      return;
    }

    const claims = (res && res.claims) ? res.claims : [];
    if(!claims.length){
      listEl.innerHTML = `<div class="claims-empty">No claims yet.</div>`;
      return;
    }

    listEl.innerHTML = claims.map(order => {
      const priceLine = order.isFree ? 'Free' : `${order.currency || '€'}${order.price}`;
      const waDigits = (order.buyerWA || '').replace(/[^0-9+]/g, '');
      const waLink = waDigits ? `https://wa.me/${waDigits.replace(/^\+/,'')}` : null;
      const confirmed = !!order.confirmed;
      return `
        <div class="claim-row ${confirmed ? '' : 'unconfirmed'}" data-claim-key="${esc(order.key)}">
          <button class="claim-confirm-toggle ${confirmed ? 'confirmed' : ''}" data-toggle-key="${esc(order.key)}" data-confirmed="${confirmed ? '1':'0'}">
            ${confirmed ? 'Confirmed' : 'Mark confirmed'}
          </button>
          <div class="claim-item-line">
            <span>${esc(order.itemName || 'Unknown item')}</span>
            <span>${esc(priceLine)}</span>
          </div>
          <div class="claim-detail-row"><span>Buyer</span><strong>${esc(order.buyerName || '—')}</strong></div>
          <div class="claim-detail-row"><span>WhatsApp</span><strong>${esc(order.buyerWA || '—')}</strong></div>
          <div class="claim-detail-row"><span>Claimed</span><strong>${esc(formatClaimDate(order.claimedAt))}</strong></div>
          ${waLink ? `<a class="claim-wa-link" href="${waLink}" target="_blank" rel="noopener">Message ${esc(order.buyerName || 'buyer')} on WhatsApp →</a>` : ''}
        </div>
      `;
    }).join('');

    listEl.querySelectorAll('.claim-confirm-toggle').forEach(btn => {
      btn.addEventListener('click', async () => {
        const key = btn.getAttribute('data-toggle-key');
        const currentlyConfirmed = btn.getAttribute('data-confirmed') === '1';
        btn.disabled = true;
        await apiCall('setClaimConfirmed', { pin: hostPin, key, confirmed: !currentlyConfirmed });
        await renderClaimsList();
      });
    });
  }

  document.getElementById('viewClaimsBtn').addEventListener('click', () => {
    if(!isHost) return;
    openClaimsView();
  });

  // ---------- Render filter bar ----------
function renderFilterBar(){
  const bar = document.getElementById('filterBar');
  if(!bar) return;
  const present = new Set(items.map(i => i.category).filter(Boolean));
  const hasFree = items.some(i => i.isFree);

  const chips = [{ key: 'all', label: 'All' }];
  if(hasFree) chips.push({ key: 'free', label: 'Free!', cls: 'free-chip' });
  chips.push(...Object.keys(CATEGORIES).filter(k => present.has(k)).map(k => ({
    key: k,
    label: CATEGORIES[k].label,
    cls: CATEGORIES[k].cls ? `cat-${k}-chip` : ''
  })));

  bar.innerHTML = chips.map(c =>
    `<button class="filter-chip ${c.cls || ''} ${activeFilter === c.key ? 'active' : ''}" data-filter="${c.key}">${esc(c.label)}</button>`
  ).join('');
  bar.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.getAttribute('data-filter');
      render();
    });
  });
}

  // ---------- Sort ----------
// Sold-out items always sink to the bottom, regardless of sort mode.
// The chosen sort only reorders the still-available items above them.
function applySort(list){
  const available = list.filter(i => i.status === 'available');
  const soldOut = list.filter(i => i.status !== 'available');

  let sortedAvailable = available;
  if(sortMode === 'price-asc'){
    sortedAvailable = [...available].sort((a,b) => (a.isFree ? 0 : a.price) - (b.isFree ? 0 : b.price));
  } else if(sortMode === 'price-desc'){
    sortedAvailable = [...available].sort((a,b) => (b.isFree ? 0 : b.price) - (a.isFree ? 0 : a.price));
  }
  return [...sortedAvailable, ...soldOut];
}

  document.getElementById('sortSelect').addEventListener('change', (e) => {
    sortMode = e.target.value;
    render();
  });

  // ---------- Render grid ----------
  function render(){
    renderFilterBar();
    const grid = document.getElementById('grid');

    let visible;
    if(activeFilter === 'all'){
      visible = items;
    } else if(activeFilter === 'free'){
      visible = items.filter(i => i.isFree);
    } else {
      visible = items.filter(i => i.category === activeFilter);
    }
    visible = applySort(visible);

    if(!visible.length){
      grid.innerHTML = `<div class="empty-state">${items.length ? 'No items in this category.' : 'No items listed yet. Add the first one!'}</div>`;
      return;
    }
    grid.innerHTML = visible.map(renderCard).join('');

    visible.forEach(item => {
      const card = document.querySelector(`[data-card="${item.id}"]`);
      if(!card) return;

      const track = card.querySelector('.carousel-track');
      const dots = card.querySelectorAll('.carousel-dots span');
      carouselState[item.id] = carouselState[item.id] || 0;

      function goTo(idx){
        const n = item.photos.length;
        idx = ((idx % n) + n) % n;
        carouselState[item.id] = idx;
        track.style.transform = `translateX(-${idx * 100}%)`;
        dots.forEach((d,i) => d.classList.toggle('active', i === idx));
      }

      const prev = card.querySelector('.carousel-nav.prev');
      const next = card.querySelector('.carousel-nav.next');
      if(prev) prev.addEventListener('click', (e)=>{ e.stopPropagation(); goTo(carouselState[item.id]-1); });
      if(next) next.addEventListener('click', (e)=>{ e.stopPropagation(); goTo(carouselState[item.id]+1); });

      track.querySelectorAll('img').forEach(img => {
        img.addEventListener('click', () => {
          openLightbox(item.photos && item.photos.length ? item.photos : [img.src], carouselState[item.id] || 0, item.name);
        });
      });

      let startX = null;
      const carousel = card.querySelector('.carousel');
      if(carousel){
        carousel.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
        carousel.addEventListener('touchend', e => {
          if(startX === null) return;
          const dx = e.changedTouches[0].clientX - startX;
          if(Math.abs(dx) > 40){ goTo(carouselState[item.id] + (dx < 0 ? 1 : -1)); }
          startX = null;
        }, {passive:true});
      }

      const noteToggle = card.querySelector('.note-toggle');
      const noteBody = card.querySelector('.note-body');
      if(noteToggle){
        noteToggle.addEventListener('click', () => {
          const open = noteBody.classList.toggle('open');
          noteToggle.textContent = open ? 'Hide details ▲' : 'Show details ▼';
        });
      }

      const claimBtn = card.querySelector('.claim-btn');
      if(claimBtn && item.status === 'available'){
        claimBtn.addEventListener('click', () => openCheckout(item.id));
      }

      const resetBtn = card.querySelector('.reset-btn');
      if(resetBtn && isHost){
        resetBtn.addEventListener('click', async () => {
          const ok = window.confirm(`Mark "${item.name}" as available again? This won't delete the existing order record.`);
          if(!ok) return;
          const res = await apiCall('setItemStatus', { pin: hostPin, id: item.id, status: 'available' });
          if(res && res.items){ items = res.items; render(); }
        });
      }

      const editBtn = card.querySelector('.edit-btn');
      if(editBtn && isHost){
        editBtn.addEventListener('click', () => openEditItem(item.id));
      }

      const deleteBtn = card.querySelector('.delete-btn');
      if(deleteBtn && isHost){
        deleteBtn.addEventListener('click', async () => {
          const ok = window.confirm(`Delete "${item.name}" permanently? This can't be undone.`);
          if(!ok) return;
          const res = await apiCall('deleteItem', { pin: hostPin, id: item.id });
          if(res && res.items){ items = res.items; render(); }
        });
      }
    });
  }

  function renderCard(item){
    const taken = item.status !== 'available';
    const photos = item.photos && item.photos.length ? item.photos : ['https://placehold.co/600x600/EFE9D8/5B5650?text=No+Photo'];
    const cat = CATEGORIES[item.category];
    const isFree = !!item.isFree;
    return `
    <div class="card ${taken ? 'is-taken':''}" data-card="${item.id}">
      <div class="carousel">
        <span class="status-tag ${taken ? '' : 'available'}">${taken ? (item.status === 'sold' ? 'Sold out' : 'Taken') : 'Available'}</span>
        ${isHost ? `
        <div class="card-actions">
          <button class="icon-btn edit-btn" title="Edit item">✎</button>
          <button class="icon-btn danger delete-btn" title="Delete item">✕</button>
        </div>
        ` : ''}
        <div class="carousel-track">
          ${photos.map(p => `<img src="${esc(p)}" alt="${esc(item.name)}" draggable="false">`).join('')}
        </div>
        ${photos.length > 1 ? `
          <div class="carousel-nav prev">‹</div>
          <div class="carousel-nav next">›</div>
          <div class="carousel-dots">${photos.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join('')}</div>
        ` : ''}
      </div>
      <div class="card-body">
        ${cat ? `<p class="category-label ${cat.cls}">${esc(cat.label)}</p>` : ''}
        <div class="item-name-row">
          <div>
            <p class="item-name">${esc(item.name)}</p>
            ${item.brand ? `<p class="item-brand">${esc(item.brand)}</p>` : ''}
          </div>
        </div>
        <div class="price-tag-row">
          <span class="price-tag ${isFree ? 'is-free' : ''}">${isFree ? 'Free' : (esc(item.currency || '€') + item.price)}</span>
        </div>
        ${item.note ? `
          <button class="note-toggle">Show details ▼</button>
          <div class="note-body"><p>${esc(item.note)}</p></div>
        ` : ''}
        <button class="claim-btn" ${taken ? 'disabled':''}>
          ${taken ? (item.status === 'sold' ? 'Sold out' : 'Already taken') : 'I want this'}
        </button>
        ${taken && isHost ? `<button class="reset-btn" data-reset="${item.id}">Mark available again</button>` : ''}
      </div>
    </div>`;
  }

  // ---------- Checkout flow ----------
  const checkoutOverlay = document.getElementById('checkoutOverlay');
  const checkoutSheet = document.getElementById('checkoutSheet');

  function openCheckout(itemId){
    const item = items.find(i => i.id === itemId);
    if(!item || item.status !== 'available') return;
    renderCheckoutForm(item);
    checkoutOverlay.classList.add('open');
  }
  function closeCheckout(){ checkoutOverlay.classList.remove('open'); }
  checkoutOverlay.addEventListener('click', (e) => { if(e.target === checkoutOverlay) closeCheckout(); });

  function renderCheckoutForm(item){
    const isFree = !!item.isFree;
    const priceDisplay = isFree ? 'Free' : (esc(item.currency||'€') + item.price);
    checkoutSheet.innerHTML = `
      <div class="sheet-head">
        <h2>Claim the item:</h2>
        <button class="close-x" id="closeCheckoutX">✕</button>
      </div>

      <div class="summary-line total">
        <span>${esc(item.name)} ${item.brand ? '· '+esc(item.brand) : ''}</span>
        <span style="color:${isFree ? '#25D366' : 'var(--pink-deep)'};">${priceDisplay}</span>
      </div>

      <div class="pickup-info-box">
        <span class="pickup-label">Pickup</span>
        <span>${esc(pickupInfo.when)} · ${esc(pickupInfo.where)}</span>
      </div>

      <form id="checkoutForm">
        <div class="field">
          <label>Your name</label>
          <input type="text" id="buyerName" required placeholder="e.g. Valentino Rossi">
        </div>
        <div class="field">
          <label>WhatsApp number</label>
          <input type="tel" id="buyerWA" required placeholder="e.g. +39 464 6464646">
        </div>


        <div class="checkbox-row">
          <input type="checkbox" id="agreePrice" required>
          <span>${isFree
            ? `I confirm my request for this item and intend to pick it up at the scheduled time and location. I understand this item is <strong>free</strong> and confirm that I certainly want it.`
            : `I confirm my order for this item and intend to pick it up at the scheduled time and location. I agree to the price of <strong>${priceDisplay}</strong>, payable in person after receiving and inspecting the item.`}</span>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="agreeWant" required>
          <span>I agree to receive order updates and notifications on WhatsApp. My name and number will be shared with the seller securely and kept strictly private.</span>
        </div>

        <button type="submit" class="submit-btn">Confirm & claim this item</button>
      </form>
    `;

    document.getElementById('closeCheckoutX').addEventListener('click', closeCheckout);

    const form = document.getElementById('checkoutForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('.submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Confirming…';

      const payload = {
        itemId: item.id,
        buyerName: document.getElementById('buyerName').value.trim(),
        buyerWA: document.getElementById('buyerWA').value.trim(),
        pickupWhen: pickupInfo.when,
        pickupWhere: pickupInfo.where
      };

      const res = await apiCall('submitClaim', payload);

      if(!res || res.error){
        submitBtn.disabled = false;
        submitBtn.textContent = 'Confirm & claim this item';
        if(res && res.error === 'already_taken'){
          form.insertAdjacentHTML('beforeend', '<p class="error-text">Sorry — this item was just claimed by someone else.</p>');
          await loadItems();
        } else {
          form.insertAdjacentHTML('beforeend', '<p class="error-text">Something went wrong saving your claim. Please try again.</p>');
        }
        return;
      }

      if(res.items) items = res.items;
      renderSuccess(item, res.claim);
      render();
    });
  }

  function buildNotifyLink(item, order){
    const priceLine = order.isFree ? 'Free' : `${order.currency}${order.price}`;
    const msg = [
      `Halo, mau konfirmasi sudah memesan item berikut ya:`,
      `Item: ${item.name}${item.brand ? ' ('+item.brand+')' : ''}`,
      `Price: ${priceLine}`,
      `Pickup: ${order.pickupWhen} · ${order.pickupWhere}`,
      `Terima kasih!`
    ].join('\n');
    return `https://wa.me/${SELLER_WA}?text=${encodeURIComponent(msg)}`;
  }

  function renderSuccess(item, order){
    const notifyLink = buildNotifyLink(item, order);
    checkoutSheet.innerHTML = `
      <div class="success-box">
        <div class="success-icon">✓</div>
        <h2>It's yours!</h2>
        <p>
          <strong>${esc(item.name)}</strong> is now reserved for you.<br>
          Pickup: ${esc(order.pickupWhen)} · ${esc(order.pickupWhere)}<br><br>
          One last step — tap below to send the seller your order details on WhatsApp.
        </p>
        <a href="${notifyLink}" target="_blank" rel="noopener" class="submit-btn" id="notifySellerBtn" style="display:block;text-decoration:none;text-align:center;">Notify seller on WhatsApp</a>
        <button class="ghost-btn" id="closeSuccessBtn" style="margin-top:10px;width:100%;">Done</button>
      </div>
    `;
    document.getElementById('closeSuccessBtn').addEventListener('click', closeCheckout);
    try{ window.open(notifyLink, '_blank'); }catch(e){}
  }

  // ---------- Add item flow (host) ----------
  const addOverlay = document.getElementById('addOverlay');
  const addSheet = document.getElementById('addSheet');
  document.getElementById('addItemBtn').addEventListener('click', () => {
    if(!isHost) return;
    openAddItem();
  });
  addOverlay.addEventListener('click', (e) => { if(e.target === addOverlay) closeAddItem(); });

  function openAddItem(){
    renderItemForm(null);
    addOverlay.classList.add('open');
  }
  function openEditItem(itemId){
    const item = items.find(i => i.id === itemId);
    if(!item) return;
    renderItemForm(item);
    addOverlay.classList.add('open');
  }
  function closeAddItem(){ addOverlay.classList.remove('open'); }

  function renderItemForm(existingItem){
    const isEdit = !!existingItem;
    addSheet.innerHTML = `
      <div class="sheet-head">
        <h2>${isEdit ? 'Edit item' : 'Add an item'}</h2>
        <button class="close-x" id="closeAddX">✕</button>
      </div>
      <form id="addForm">
        <div class="field">
          <label>Item name</label>
          <input type="text" id="newName" required placeholder="e.g. Denim Jacket">
        </div>
        <div class="row2">
          <div class="field">
            <label>Brand (optional)</label>
            <input type="text" id="newBrand" placeholder="e.g. Levi's">
          </div>
          <div class="field">
            <label>Category</label>
            <select id="newCategory">
              <option value="">None</option>
              <option value="electronics">Electronics</option>
              <option value="clothes">Clothes</option>
              <option value="food">Food</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Price (€)</label>
          <input type="number" id="newPrice" min="0" step="0.5" placeholder="25">
          <div class="checkbox-row" style="margin-top:8px;margin-bottom:0;">
            <input type="checkbox" id="newIsFree">
            <span>This item is <strong>free</strong></span>
          </div>
        </div>
        <div class="field">
          <label>Note / description</label>
          <textarea id="newNote" placeholder="Condition, size, why you're selling it…"></textarea>
        </div>
        <div class="field">
          <label>Photo URLs (one per line, first = cover)</label>
          <textarea id="newPhotos" placeholder="https://..." style="min-height:70px;"></textarea>
          <p class="hint">Paste direct image links. You can add more later by editing this list.</p>
        </div>
        <button type="submit" class="submit-btn">${isEdit ? 'Save changes' : 'Add to shop'}</button>
      </form>
    `;
    document.getElementById('closeAddX').addEventListener('click', closeAddItem);

    const freeCheckbox = document.getElementById('newIsFree');
    const priceInput = document.getElementById('newPrice');

    function applyFreeState(){
      if(freeCheckbox.checked){
        priceInput.value = '';
        priceInput.disabled = true;
        priceInput.placeholder = 'Free';
      } else {
        priceInput.disabled = false;
        priceInput.placeholder = '25';
      }
    }
    freeCheckbox.addEventListener('change', applyFreeState);

    if(isEdit){
      document.getElementById('newName').value = existingItem.name || '';
      document.getElementById('newBrand').value = existingItem.brand || '';
      document.getElementById('newCategory').value = existingItem.category || '';
      document.getElementById('newNote').value = existingItem.note || '';
      document.getElementById('newPhotos').value = (existingItem.photos || []).join('\n');
      freeCheckbox.checked = !!existingItem.isFree;
      priceInput.value = existingItem.isFree ? '' : (existingItem.price ?? '');
      applyFreeState();
    }

    const form = document.getElementById('addForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const isFree = freeCheckbox.checked;
      if(!isFree && !priceInput.value){
        priceInput.focus();
        return;
      }
      const submitBtn = form.querySelector('.submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = isEdit ? 'Saving…' : 'Adding…';

      const photosRaw = document.getElementById('newPhotos').value.trim();
      const photos = photosRaw.split('\n').map(s => s.trim()).filter(Boolean);

      const itemPayload = {
        id: isEdit ? existingItem.id : '',
        name: document.getElementById('newName').value.trim(),
        brand: document.getElementById('newBrand').value.trim(),
        category: document.getElementById('newCategory').value,
        price: isFree ? 0 : parseFloat(priceInput.value),
        currency: '€',
        isFree: isFree,
        note: document.getElementById('newNote').value.trim(),
        photos: photos.length ? photos : [],
        status: isEdit ? existingItem.status : 'available'
      };

      const res = await apiCall('saveItem', { pin: hostPin, item: itemPayload });
      if(res && res.items){ items = res.items; }
      render();
      closeAddItem();
    });
  }

  // ---------- Edit pickup info flow (host) ----------
  const pickupOverlay = document.getElementById('pickupOverlay');
  const pickupSheet = document.getElementById('pickupSheet');
  document.getElementById('editPickupBtn').addEventListener('click', () => {
    if(!isHost) return;
    openEditPickup();
  });
  pickupOverlay.addEventListener('click', (e) => { if(e.target === pickupOverlay) closeEditPickup(); });

  function openEditPickup(){
    renderEditPickupForm();
    pickupOverlay.classList.add('open');
  }
  function closeEditPickup(){ pickupOverlay.classList.remove('open'); }

  function renderEditPickupForm(){
    pickupSheet.innerHTML = `
      <div class="sheet-head">
        <h2>Pickup details</h2>
        <button class="close-x" id="closePickupX">✕</button>
      </div>
      <p class="hint" style="margin-bottom:16px;">
        This is shown to everyone at the top of the page, and is what buyers agree to when they check out.
      </p>
      <form id="pickupForm">
        <div class="field">
          <label>When</label>
          <input type="text" id="pickupWhenInput" required placeholder="e.g. Sat 27 June, 2–5 PM">
        </div>
        <div class="field">
          <label>Where</label>
          <input type="text" id="pickupWhereInput" required placeholder="e.g. Porta Romana M3, Milan">
        </div>
        <button type="submit" class="submit-btn">Save</button>
      </form>
    `;
    document.getElementById('closePickupX').addEventListener('click', closeEditPickup);
    document.getElementById('pickupWhenInput').value = pickupInfo.when || '';
    document.getElementById('pickupWhereInput').value = pickupInfo.where || '';

    const form = document.getElementById('pickupForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('.submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving…';

      const payload = {
        when: document.getElementById('pickupWhenInput').value.trim(),
        where: document.getElementById('pickupWhereInput').value.trim()
      };
      const res = await apiCall('savePickupInfo', Object.assign({ pin: hostPin }, payload));
      if(res && res.pickupInfo){ pickupInfo = res.pickupInfo; }
      renderPickupBanner();
      closeEditPickup();
    });
  }

  // ---------- Photo lightbox ----------
  const lightboxOverlay = document.getElementById('lightboxOverlay');
  const lightboxTrack = document.getElementById('lightboxTrack');
  const lightboxDots = document.getElementById('lightboxDots');
  const lightboxCaption = document.getElementById('lightboxCaption');
  let lbPhotos = [];
  let lbIndex = 0;
  let lbName = '';

  function openLightbox(photos, startIndex, name){
    lbPhotos = photos;
    lbIndex = startIndex;
    lbName = name;
    lightboxTrack.innerHTML = lbPhotos.map(p =>
      `<div class="lightbox-track-item"><img src="${esc(p)}" alt="${esc(name)}" draggable="false"></div>`
    ).join('');
    lightboxDots.innerHTML = lbPhotos.length > 1
      ? lbPhotos.map((_,i) => `<span class="${i===lbIndex?'active':''}"></span>`).join('')
      : '';
    document.getElementById('lightboxPrev').style.display = lbPhotos.length > 1 ? '' : 'none';
    document.getElementById('lightboxNext').style.display = lbPhotos.length > 1 ? '' : 'none';
    goToLightbox(lbIndex, false);
    lightboxOverlay.classList.add('open');
  }

  function goToLightbox(idx, animate){
    const n = lbPhotos.length;
    idx = ((idx % n) + n) % n;
    lbIndex = idx;
    lightboxTrack.style.transition = animate === false ? 'none' : '';
    lightboxTrack.style.transform = `translateX(-${idx * 100}%)`;
    if(animate === false){
      requestAnimationFrame(() => { lightboxTrack.style.transition = ''; });
    }
    lightboxDots.querySelectorAll('span').forEach((d,i) => d.classList.toggle('active', i === idx));
    lightboxCaption.textContent = lbPhotos.length > 1 ? `${lbName} — ${idx+1} / ${lbPhotos.length}` : lbName;
  }

  function closeLightbox(){ lightboxOverlay.classList.remove('open'); }

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', () => goToLightbox(lbIndex - 1));
  document.getElementById('lightboxNext').addEventListener('click', () => goToLightbox(lbIndex + 1));
  lightboxOverlay.addEventListener('click', (e) => { if(e.target === lightboxOverlay) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if(!lightboxOverlay.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') goToLightbox(lbIndex - 1);
    if(e.key === 'ArrowRight') goToLightbox(lbIndex + 1);
  });

  (function(){
    let startX = null;
    const stage = document.getElementById('lightboxStage');
    stage.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
    stage.addEventListener('touchend', e => {
      if(startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      if(Math.abs(dx) > 40){ goToLightbox(lbIndex + (dx < 0 ? 1 : -1)); }
      startX = null;
    }, {passive:true});
  })();

  applyHostUI();
  loadItems();
  loadPickupInfo();
})();
</script>

</body>
</html>
